<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courtside Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1115;--s1:#171A20;--s2:#1F232B;--ln:#2A2F38;--ln2:#3A404B;--tx:#F4EFE6;--mu:#9AA1AB;--or:#F26A21;--or2:#FF8A4C;--ms:#E8E4DB;
--disp:'Barlow Condensed','Oswald','Arial Narrow',Impact,sans-serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--sc:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07080A;color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
.app{min-height:100%;display:flex;justify-content:center;align-items:flex-start;gap:36px;padding:24px}
.flow{width:270px;flex:none;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;scrollbar-width:thin}
.flow h2{font-family:var(--disp);font-size:28px;letter-spacing:.02em;text-transform:uppercase;font-weight:800}
.flow .sub{color:var(--mu);font-size:12px;margin:2px 0 12px;line-height:1.4}
.fl-h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6b727d;margin:14px 10px 4px;font-weight:600}
.fl-btn{display:flex;gap:10px;align-items:center;width:100%;padding:7px 10px;border-radius:10px;font-size:13px;color:#c9cdd3;min-height:34px}
.fl-btn:hover{background:#171A20}
.fl-btn.on{background:#1F232B;color:#fff}
.fl-btn b{font-family:var(--disp);color:var(--or);width:20px;font-size:17px;font-weight:700}
.fl-btn.restart{border:1.5px solid var(--ln2);justify-content:center;margin-top:10px;font-weight:600;color:var(--tx)}
.alt{display:flex;gap:10px;align-items:center;width:100%;padding:7px 10px;border-radius:10px;font-size:13px;color:#c9cdd3;min-height:34px}
.alt:hover{background:#171A20}
.sw{width:34px;height:20px;border-radius:12px;background:#2A2F38;position:relative;flex:none;border:1px solid var(--ln2)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#9AA1AB;transition:.15s}
.alt.on .sw{background:var(--or);border-color:var(--or)}
.alt.on .sw::after{left:16px;background:#0F1115}
.stagebox{flex:none;width:calc(390px*var(--sc));height:calc(844px*var(--sc));margin:11px}
.phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--bg);transform:scale(var(--sc));transform-origin:0 0;box-shadow:0 0 0 10px #1a1c21,0 0 0 11px #2e323a,0 40px 90px rgba(0,0,0,.65);font-family:var(--sans)}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0;font-size:15px;font-weight:600;z-index:30;pointer-events:none}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:20px;background:#000;z-index:31}
.prog{position:absolute;top:44px;left:0;right:0;height:32px;display:flex;gap:4px;padding:0 16px;z-index:12}
.prog div{flex:1;font-size:10.5px;color:#6b727d;font-weight:600;white-space:nowrap;text-align:left}
.prog div i{display:block;height:3px;border-radius:2px;background:var(--ln);margin-bottom:5px}
.prog div.past i{background:rgba(242,106,33,.5)}
.prog div.on i{background:var(--or)}
.prog div.on{color:var(--tx)}
.hdr{position:absolute;top:76px;left:0;right:0;height:50px;display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;z-index:12}
.ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.ib:active{background:var(--s2)}
.ib.ph{visibility:hidden}
.hdt{flex:1;min-width:0}
.hdt b{display:block;font-family:var(--disp);font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdt span{font-size:11px;color:var(--mu)}
.dchip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--ln2);border-radius:99px;padding:0 11px;height:36px;font-size:12px;font-weight:600;flex:none;background:var(--s1)}
.dchip .dd{width:8px;height:8px;border-radius:50%;background:var(--or)}
.dchip.off .dd{background:transparent;border:2px solid var(--mu)}
.dchip.low{border-color:var(--ms)}
.view{position:absolute;top:126px;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.view>.pg{flex:none}
.view::-webkit-scrollbar{display:none}
.view.hasnav{bottom:78px}
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:rgba(15,17,21,.97);border-top:1px solid var(--ln);display:flex;padding:6px 8px 0;z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);height:52px;justify-content:center;border-radius:12px;font-weight:600}
.nav button.on{color:var(--or)}
.hi{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#E8E4DB;opacity:.45;z-index:40;pointer-events:none}
.pg{padding:6px 20px 8px}
.cta{margin-top:auto;position:sticky;bottom:0;flex:none;padding:22px 20px 14px;background:linear-gradient(to top,var(--bg) 62%,rgba(15,17,21,0));z-index:5}
.cta .lnk{display:block;text-align:center;margin-top:10px;font-size:14px;color:var(--mu);text-decoration:underline;padding:8px;font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;padding:0 20px;font-weight:700;font-size:16px;width:100%;text-align:center}
.btn.pri{background:var(--or);color:#0F1115}
.btn.pri:active{background:var(--or2)}
.btn.gh{border:1.5px solid var(--ln2);color:var(--tx)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.h1{font-family:var(--disp);font-size:38px;line-height:.98;text-transform:uppercase;font-weight:800;letter-spacing:.005em}
.h2{font-family:var(--disp);font-size:24px;text-transform:uppercase;font-weight:700;letter-spacing:.02em;line-height:1}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600}
.mu{color:var(--mu)} .or{color:var(--or)} .sm{font-size:13px} .xs{font-size:12px}
.big{font-family:var(--disp);font-weight:800;line-height:.88}
.lead{color:var(--mu);font-size:15px;line-height:1.45;margin-top:8px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.gap8{margin-top:8px}.gap14{margin-top:14px}.gap20{margin-top:20px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:7px;border:1px solid var(--ln2);color:var(--mu);white-space:nowrap}
.tag.or{border-color:var(--or);color:var(--or)}
.tag.wh{border-color:var(--ms);color:var(--ms)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--ln2);font-size:14px;font-weight:600;min-height:42px}
.chip.on{border-color:var(--or);background:rgba(242,106,33,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mu);min-height:38px;text-align:center}
.seg button.on{background:#0F1115;color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--ln2);margin-top:10px;min-height:62px;background:var(--s1)}
.opt.on{border-color:var(--or);background:rgba(242,106,33,.1)}
.opt .t{font-weight:700;font-size:16px;display:block}
.opt .s{font-size:13px;color:var(--mu);display:block;margin-top:2px}
.opt .grow{flex:1}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln2);display:flex;align-items:center;justify-content:center;flex:none}
.opt.on .radio{background:var(--or);border-color:var(--or);color:#0F1115}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--ln2);background:var(--s1);font-size:13px;line-height:1.45;margin:0 0 12px}
.note b{display:block;font-size:14px;margin-bottom:2px}
.note svg{flex:none;margin-top:1px}
.note.warn{border-color:var(--ms);background:rgba(232,228,219,.06)}
.note.ok{border-color:rgba(242,106,33,.5);background:rgba(242,106,33,.08)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--s2);border:2px solid var(--ln2);font-family:var(--disp);font-weight:700;flex:none}
.av.on{border-color:var(--or);background:rgba(242,106,33,.18)}
.who{display:flex;gap:8px}
.who button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;flex:1;padding:8px 2px;border-radius:12px;min-height:64px;text-align:center}
.who button.on{background:rgba(242,106,33,.1)}
.illus{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:16px}
.cap{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;font-weight:600}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;margin-top:10px}
.steps li i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--s2);border:1.5px solid var(--ln2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15px}
.chk:last-child{border:0}
.chk .ci{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln2);display:flex;align-items:center;justify-content:center;flex:none}
.chk.done .ci{background:var(--or);border-color:var(--or);color:#0F1115}
.chk.bad .ci{border-color:var(--ms);color:var(--ms)}
.chk .r{margin-left:auto;font-size:13px;color:var(--mu);text-align:right}
.timer{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.timer b{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:.02em}
.tbar{height:5px;border-radius:3px;background:var(--ln);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;background:var(--or)}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:50}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--s1);border-radius:26px 26px 0 0;padding:10px 20px 26px;z-index:51;border-top:1px solid var(--ln2);animation:up .22s ease-out;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--ln2);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(10px);background:var(--ms);color:#0F1115;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap;max-width:350px}
.toast.show{opacity:1;transform:translateX(-50%)}
.court{width:100%;height:auto;display:block}
.court text{pointer-events:none}
.zp{font:800 17px var(--disp);fill:#F4EFE6;stroke:#0F1115;stroke-width:3px;paint-order:stroke}
.zc{font:600 9px var(--sans);fill:#e1dcd2;stroke:#0F1115;stroke-width:2.5px;paint-order:stroke}
.dot{cursor:pointer}
.hero{display:flex;gap:0;margin-top:14px}
.hero>div{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pill.make{background:var(--or);color:#0F1115}
.pill.miss{border:1.5px solid var(--ms);color:var(--ms)}
.cov{margin-top:14px}
.covb{position:relative;height:8px;background:var(--ln);border-radius:4px;overflow:hidden}
.covb i{position:absolute;top:0;bottom:0;background:var(--or)}
.covb i.gp{background:repeating-linear-gradient(45deg,#6B7280 0 3px,#2A2F38 3px 6px)}
.clips{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.clips::-webkit-scrollbar{display:none}
.clipc{flex:none;width:158px}
.thumb{position:relative;width:158px;height:104px;border-radius:14px;overflow:hidden;background:#1a1d23;border:1px solid var(--ln)}
.thumb .pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:rgba(15,17,21,.75);border:1.5px solid var(--ms);display:flex;align-items:center;justify-content:center}
.thumb .tm{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:6px}
.thumb.dash{border-style:dashed;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--mu);font-size:12px;text-align:center}
.flag{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:1.5px dashed var(--ln2);border-radius:16px;margin-bottom:10px;background:var(--s1)}
.flag .fq{width:44px;height:44px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;flex:none;border:1px dashed var(--ms)}
.stat3{display:flex;gap:10px}
.stat3>div{flex:1;background:var(--s2);border-radius:14px;padding:12px}
.soon{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);color:var(--mu);font-size:14px}
.soon:last-child{border:0}
.scene{border-radius:16px;overflow:hidden;border:1px solid var(--ln);background:#12151a}
.scene svg{display:block;width:100%;height:auto}
.live{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:99px;border:1.5px solid var(--ln2)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--or);animation:pulse 1.2s infinite}
.live.warn i{background:transparent;border:2px solid var(--ms);animation:none}
@keyframes pulse{50%{opacity:.25}}
.ring{transform:rotate(-90deg)}
.spin{animation:spin 1.2s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:pulse 1.1s infinite}
.sk{background:var(--s2);border-radius:10px}
input.tx{width:100%;background:var(--s1);border:1.5px solid var(--ln2);border-radius:14px;padding:0 16px;height:56px;font-size:18px;font-weight:600;outline:none}
input.tx:focus{border-color:var(--or)}
.sharecard{position:relative;border-radius:22px;overflow:hidden;padding:18px;background:linear-gradient(155deg,#1b1410 0%,#0F1115 45%,#3a1a09 100%);border:1px solid var(--ln2)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--ln)}
.mrow:last-child{border:0}
@media (max-width:880px){
 .app{flex-direction:column;align-items:center;gap:16px;padding:16px 8px}
 .flow{width:100%;max-width:420px;position:static;max-height:none}
 .flow .lst{display:flex;flex-wrap:wrap;gap:4px}
 .flow .lst .fl-btn{width:auto}
 .stagebox{margin:11px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="flow" id="flow"></aside>
 <div class="stagebox"><div class="phone" id="phone">
  <div class="notch"></div>
  <div class="sb"><span>7:02</span><span id="sbr"></span></div>
  <div class="prog" id="prog"></div>
  <div class="hdr" id="hdr"></div>
  <div class="view" id="view"></div>
  <nav class="nav" id="nav"></nav>
  <div id="sheetroot"></div>
  <div class="toast" id="toast"></div>
  <div class="hi"></div>
 </div></div>
</div>

<script>
/* ---------- constants ---------- */
const ORDER=['onboarding','mount','players','identify','play','processing','recap','correct','profile'];
const TITLE={onboarding:'Link a wearable',plan:'Plan session',mount:'Set up your phone',players:'Who is playing?',identify:'Identify yourself',play:'Play',processing:'Processing',recap:'Session recap',correct:'Correct and confirm',profile:'Profile',community:'Community'};
const HT={onboarding:'Link a wearable',plan:'Plan',mount:'Phone setup',players:'Players',identify:'Identify',play:'Play',processing:'Processing',recap:'Recap',correct:'Confirm',profile:'Profile',community:'Community'};
const MENU={onboarding:'Link a wearable',plan:'Plan session',mount:'Set up your phone',players:'Who is playing?',identify:'Identify self',play:'Play',processing:'Processing',recap:'Recap',correct:'Correct and confirm',profile:'Profile',community:'Community'};
const PHASE={onboarding:0,mount:1,players:1,identify:1,play:1,processing:2,recap:2,correct:2,profile:2};
const PH=['Wearable','On the court','After the session'];
const PPL=[{id:'you',n:'You',i:'U'},{id:'emily',n:'Emily',i:'E'},{id:'jonathan',n:'Jonathan',i:'J'},{id:'bryant',n:'Bryant',i:'B'},{id:'urbee',n:'Urbee',i:'U'},{id:'trisha',n:'Trisha',i:'T'}];
const COURTS=[
 {id:'fg',n:'Fort Greene Park Court',loc:'Brooklyn',t:'park',d:'0.6 mi',note:'Outdoor, 2 hoops. Bring your phone.'},
 {id:'atl',n:'Atlantic Ave Rec Gym, Court 1',loc:'Brooklyn',t:'gym',d:'1.2 mi',note:'Indoor. Check in at the front desk.'},
 {id:'p2',n:'Pier 2 Courts',loc:'Brooklyn Bridge Park',t:'park',d:'2.0 mi',note:'Outdoor, 4 hoops. Lights until 10 PM.'}
];
const DAYS=[['today','Today','Tue 13'],['wed','Wed','14'],['thu','Thu','15'],['fri','Fri','16'],['sat','Sat','17']];
const TIMES=[['12pm','12 PM'],['2pm','2 PM'],['4pm','4 PM'],['6pm','6 PM'],['7pm','7 PM']];
const FREE={bryant:['fri-2pm','fri-4pm','sat-12pm'],emily:['today-6pm','fri-2pm','thu-7pm'],jonathan:['today-6pm','wed-6pm','fri-4pm']};
const ZN={lc:'Left corner 3',lw:'Left wing 3',tp:'Top of key 3',rw:'Right wing 3',rc:'Right corner 3',ml:'Left midrange',mc:'Middle midrange',mr:'Right midrange',lf:'Left-side finish',rf:'Right-side finish'};

/* ---------- shot data ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RN=mulberry(11);
const rad=d=>d*Math.PI/180;
const polar=(a,b)=>{const f=a+RN()*(b-a),r=150+RN()*12;return [150+r*Math.sin(rad(f)),238-r*Math.cos(rad(f))]};
const ZD=[
 {k:'lc',g:'3',a:3,m:1,lx:17,ly:212,pos:()=>[8+RN()*16,185+RN()*72]},
 {k:'lw',g:'3',a:4,m:2,lx:52,ly:100,pos:()=>polar(-58,-30)},
 {k:'tp',g:'3',a:4,m:2,lx:150,ly:50,pos:()=>polar(-13,13)},
 {k:'rw',g:'3',a:4,m:2,lx:248,ly:100,pos:()=>polar(30,58)},
 {k:'rc',g:'3',a:3,m:2,lx:283,ly:212,pos:()=>[276+RN()*16,185+RN()*72]},
 {k:'ml',g:'2',a:5,m:3,lx:66,ly:205,pos:()=>[52+RN()*44,152+RN()*96]},
 {k:'mc',g:'2',a:7,m:3,lx:150,ly:126,pos:()=>[120+RN()*60,114+RN()*34]},
 {k:'mr',g:'2',a:5,m:2,lx:234,ly:205,pos:()=>[204+RN()*44,152+RN()*96]},
 {k:'lf',g:'r',a:6,m:3,lx:126,ly:192,pos:()=>[112+RN()*26,208+RN()*42]},
 {k:'rf',g:'r',a:6,m:4,lx:174,ly:192,pos:()=>[162+RN()*26,208+RN()*42]}
];
function genShots(){
 const S=[];
 ZD.forEach(z=>{
  let made=Array(z.a).fill(false).fill(true,0,z.m);
  for(let i=made.length-1;i>0;i--){const j=Math.floor(RN()*(i+1));[made[i],made[j]]=[made[j],made[i]]}
  const lfSec=[252,570,965,1660,2000,2295];

   S.push({z:z.k,g:z.g,made:made[i],x,y,sec:z.k==='lf'?lfSec[i]:90+Math.floor(RN()*2300),p:'you'});
  }
 });
 S.sort((a,b)=>a.sec-b.sec);
 S.forEach((s,i)=>s.id='s'+(i+1));
 const f1=S.find(s=>s.z==='rw'&&s.sec>1100)||S.find(s=>s.z==='rw');f1.flag='Ball was hidden behind a screen';
 const f2=S.find(s=>s.z==='lf'&&s.sec===2000);f2.flag='Two players at the rim, shooter unclear';
 return S;
}

/* ---------- banners ---------- */
function banners(sc){
 let h='';
 const live=['mount','identify','play','processing','recap'].includes(sc);
 if(live&&alt.offline)h+=`<div class="note">${icon('wifioff')}<div><b>Offline court</b>Recording locally, will sync later.</div></div>`;
 if(['identify','play'].includes(sc)&&alt.low)h+=`<div class="note warn">${icon('alert')}<div><b>Phone battery low, 12%</b>About 20 minutes of recording left. Plug in after this session or bring a battery pack.</div></div>`;

  <div class="note gap14"><div style="color:var(--or)">${icon('lock')}</div><div>Wearable data stays on your account and is never shared with other players.</div></div>`}

 h+=`<div class="lbl gap20">Day</div><div class="chips gap8">${DAYS.map(([k,a,b])=>`<button class="chip ${p.day===k?'on':''}" data-act="pday" data-v="${k}">${a} ${b}</button>`).join('')}</div>`;
 h+=`<div class="lbl gap20">Time (1 hour)</div><div class="chips gap8">${TIMES.map(([k,a])=>`<button class="chip ${p.time===k?'on':''}" data-act="ptime" data-v="${k}">${a}</button>`).join('')}</div>`;

function mount(){
 const steps=mountSteps(),k=steps[state.step],ty=ctype(),c=court();
 const est={checkin:'10 sec',place:'20 sec',frame:'15 sec',calibrate:'15 sec',ready:''};
 if(!state.mt.start)state.mt.start=Date.now();
 if(k==='ready'&&!state.mt.end)state.mt.end=Date.now();
 const el=((state.mt.end||Date.now())-state.mt.start)/1000;
 let h=`<div class="pg">`;
 h+=`<div class="seg" style="margin-bottom:12px" role="group" aria-label="Preview court type"><button class="${ty==='park'?'on':''}" data-act="mview" data-v="park">Preview: Park</button><button class="${ty==='gym'?'on':''}" data-act="mview" data-v="gym">Preview: Gym</button></div>`;
 h+=`<div class="timer"><div><div class="lbl">Setup time</div><div class="xs mu">Goal: under 1:00${est[k]?` · this step ~${est[k]}`:''}</div></div><b id="mtimer">${fmt(el)}</b></div>`;
 h+=banners('mount');
 if(k==='checkin')h+=`<div class="h1">Check in at the court</div><p class="lead">${ty==='gym'?'Atlantic Ave Rec Gym, Court 1':c.n}. Show your membership at the front desk or enter the court code.</p><div class="card gap20"><div class="row"><span style="color:var(--or)">${icon('qr',32)}</span><div style="flex:1"><b>Court code</b><div class="xs mu">Posted at the front desk</div></div><span class="h2" style="font-size:30px">ATL-01</span></div></div><div class="note">${icon('lock')}<div><b>Your phone only</b>Courtside records only your court, from your own phone.</div></div>`;
 if(k==='place'){h+=`<div class="h1">Prop up your phone</div><p class="lead">Landscape, near the sideline, with the hoop and key in view. A fence, a bag or a tripod all work. No extra hardware needed.</p><div class="illus">${placeSVG()}<div class="cap">Any steady spot works</div></div>`;
  if(ty==='park')h+=`<div class="note gap14">${icon('shield')}<div><b>Privacy at public courts</b>Other people may be in frame. Courtside only analyzes shots, blurs faces in saved clips and never identifies anyone.</div></div>`;
  else h+=`<button class="opt ${state.gymOk?'on':''} gap14" data-act="gymok" aria-pressed="${state.gymOk}"><span class="grow"><span class="t">Confirm the gym allows filming</span><span class="s">Ask the front desk before you start recording.</span></span><span class="radio">${state.gymOk?icon('check',16,3):''}</span></button>`;
  h+=`<div class="note gap14">${icon('target')}<div><b>Optional mount, later</b>A clip-on hoop mount for a steadier view may come later. You do not need it.</div></div>`}
 if(k==='frame'){const bad=alt.frame;h+=`<div class="h1">Hoop in frame?</div><p class="lead">${bad?'The phone is tilted and the rim is cut off.':'Make sure the rim and key are in view.'}</p><div class="scene gap14">${camScene({bad})}</div>
  <div class="card gap14" style="padding:6px 16px"><div class="chk ${bad?'bad':'done'}"><span class="ci">${icon(bad?'alert':'check',14,3)}</span><span>Rim in frame</span><span class="r">${bad?'Cut off':'Detected'}</span></div><div class="chk ${bad?'bad':'done'}"><span class="ci">${icon(bad?'alert':'check',14,3)}</span><span>Phone level</span><span class="r">${bad?'Tilted 12 deg':'0.6 deg'}</span></div></div>
  ${bad?`<div class="note warn">${icon('alert')}<div><b>Phone not level</b>Straighten the phone until the rim sits inside the box, then re-check.</div></div>`:''}`}
 if(k==='calibrate')h+=`<div class="h1">Confirm court lines</div><p class="lead">We found the key, free throw line and three-point arc. Do these look right?</p><div class="scene gap14">${camScene({lines:true,det:false})}</div><div class="chips gap14"><span class="chip on">${icon('check',14,3)} Key</span><span class="chip on">${icon('check',14,3)} Free throw line</span><span class="chip on">${icon('check',14,3)} 3-point arc</span></div>`;
 if(k==='ready'){const tt=fmt(el);h+=`<div style="text-align:center;padding-top:6px"><div style="width:84px;height:84px;border-radius:50%;background:var(--or);color:#0F1115;display:flex;align-items:center;justify-content:center;margin:0 auto 14px">${icon('check',46,3)}</div><div class="h1">Ready</div><p class="lead">Set up in <b style="color:var(--tx)">${tt}</b>. Nice and quick.</p></div>
  <div class="card gap20"><div class="mrow" style="padding-top:0"><span class="mu">${icon('pin')}</span><span>${c.n}</span><span style="margin-left:auto">${tagC({t:ty})}</span></div><div class="mrow"><span class="mu">${icon('batt')}</span><span>${state.dev.name}</span><b style="margin-left:auto">${batt()}%</b></div><div class="mrow"><span class="mu">${icon('target')}</span><span>Hoop and court lines</span><b style="margin-left:auto">Locked</b></div><div class="mrow" style="padding-bottom:0"><span class="mu">${icon(alt.offline?'wifioff':'sync')}</span><span>Sync</span><b style="margin-left:auto">${alt.offline?'Offline, record locally':'Online'}</b></div></div>`;
  if(ty==='park')h+=`<div class="note">${icon('shield')}<div>People nearby may appear in frame. Faces are blurred in saved clips.</div></div>`}
 return h+'</div>'}

 return `<div class="pg" style="text-align:center"><div class="h1" style="margin-top:6px">Building your session</div><p class="lead">${off?'Saved on this phone. We will finish when you are back online.':'Hang tight, this takes about a minute.'}</p>
 <div style="margin:22px auto 10px;width:150px;height:150px;position:relative"><svg class="ring" width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="#2A2F38" stroke-width="10"/><circle cx="75" cy="75" r="64" fill="none" stroke="#F26A21" stroke-width="10" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="${402*(1-Math.min(i,4)/4)}" style="transition:stroke-dashoffset .6s"/></svg><div class="big" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px">${Math.round(Math.min(i,4)*25)}%</div></div>

 ${part&&i>=2?`<div class="note warn" style="text-align:left">${icon('alert')}<div><b>Partial session, some shots unclear</b>Tracking dropped for about 6 minutes. You can review the unclear shots next.</div></div>`:''}</div>`}

function recap(){
 const s=stats(),flagged=mine().filter(x=>x.flag&&!x.res);
 const clips=clipOf(),zsel=state.zsel;
 const early=mine().filter(x=>x.z==='lf'&&x.sec<1200),late=mine().filter(x=>x.z==='lf'&&x.sec>=1200);
 const em=early.filter(x=>x.made).length,lm=late.filter(x=>x.made).length;
 let h=`<div class="pg"><div class="rowb"><div><div class="lbl">Session recap</div><div class="h1" style="font-size:32px;margin-top:4px">${court().n.split(',')[0]}</div><div class="mu sm gap8">Tue, Oct 13 · 6:10 PM · 41 min · ${state.mode==='multi'?'Pickup':'Solo'}</div></div><button class="ib" data-act="sheet" data-t="share" aria-label="Share session">${icon('share')}</button></div>`;
 h+=banners('recap');
 if(alt.partial)h+=`<div class="note warn gap14">${icon('alert')}<div><b>Partial session, some shots unclear</b>The camera lost tracking from 24:10 for about 6 minutes. Counts may be low.</div></div>`;
 if(alt.offline)h+=`<div class="note gap14">${icon('sync')}<div><b>Sync pending</b>These are local stats. Clips and insights fill in after sync.</div></div>`;
 h+=`<div class="hero"><div><div class="big or" style="font-size:78px">${s.points}</div><div class="lbl gap8">Points</div></div><div><div class="big" style="font-size:78px">${state.mode==='multi'?state.session.rebounds:'—'}</div><div class="lbl gap8">Rebounds</div></div><div><div class="big" style="font-size:78px">${state.mode==='multi'?state.session.assists:'—'}</div><div class="lbl gap8">Assists</div></div></div>${state.mode==='solo'?'<div class="xs mu gap8">Rebounds and assists are tracked in multi-player sessions.</div>':''}`;
 h+=`<div class="cov"><div class="covb">${alt.partial?'<i style="left:0;width:59%"></i><i class="gp" style="left:59%;width:14.6%"></i><i style="left:73.6%;width:26.4%"></i>':'<i style="left:0;width:100%"></i>'}</div><div class="xs mu gap8">${alt.partial?'Tracked 35 of 41 min. Hatched part = tracking gap.':'Tracked the full 41 min.'}</div></div>`;
 h+=`<div class="stat3 gap14" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr))">${[['Overall FG',s],['Mid-range',groupStats('2')],['Three-point',groupStats('3')],['At rim',groupStats('r')]].map(([label,st])=>`<div><div class="big" style="font-size:34px">${st.fg}%</div><div class="lbl gap8">${label}</div><div class="xs mu gap8">${st.m} / ${st.a} made</div></div>`).join('')}</div>`;
 h+=`<div class="card gap14" style="margin-top:14px"><div class="rowb"><div class="h2">Shot chart</div><div class="seg" style="width:150px"><button class="${state.cmode==='both'?'on':''}" data-act="cmode" data-v="both">Shots</button><button class="${state.cmode==='zones'?'on':''}" data-act="cmode" data-v="zones">Zones</button></div></div>

 <div class="row gap14" style="flex-wrap:wrap;gap:12px 16px;font-size:12px;color:var(--mu)"><span class="row" style="gap:6px"><svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="#F26A21"/></svg>Make</span><span class="row" style="gap:6px"><svg width="14" height="14"><path d="M2 2L12 12M12 2L2 12" stroke="#E8E4DB" stroke-width="2"/></svg>Miss</span><span class="row" style="gap:6px"><svg width="14" height="14"><rect x=".5" y=".5" width="13" height="13" fill="#F26A21" opacity=".6"/></svg>Hot 75%+</span><span class="row" style="gap:6px"><svg width="14" height="14"><defs><pattern id="lg" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#262b33"/><line x1="0" y1="0" x2="0" y2="5" stroke="#6B7280" stroke-width="2"/></pattern></defs><rect x=".5" y=".5" width="13" height="13" fill="url(#lg)"/></svg>Cold under 60%</span></div></div>`;
 h+=alt.offline?`<div class="card"><div class="row"><span class="mu">${icon('bolt')}</span><div><b>Insight arrives after sync</b><div class="xs mu">We need the full session to spot patterns.</div></div></div></div>`

 const v=[...hist[k],cur],lab=['Aug 28','Sep 3','Sep 10','Sep 17','Sep 24','Oct 1','Oct 6','Today'];

const SCREENS={onboarding,plan,mount,players,identify,play,processing,recap,correct,profile,community};

/* ---------- CTA ---------- */
function cta(){
 const sc=state.screen,s=state.step;
 let c={l:'Continue',a:'next'};
 if(sc==='onboarding'){c.l='Continue';c.sec={l:'Skip for now',a:'next'}}
 if(sc==='plan')c.l='Confirm plan and head to the court';
 if(sc==='mount'){const k=mountSteps()[s];
  c.l={checkin:'Check in',place:'Phone is set',frame:'Looks good',calibrate:'Lines look right',ready:'Who is playing?'}[k];
  if(k==='frame'&&alt.frame)c={l:'Adjust and re-check',a:'fixframe'}}
 if(sc==='players')c.l='Identify yourself';
 if(sc==='identify')c.l="Start session";
 if(sc==='play'){c={l:'End session',a:'next'};if(alt.disc)c={l:'Resume recording',a:'reconnect',sec:{l:'End session anyway',a:'next'}}}
 if(sc==='processing')c.l=state.proc.i>=4?'See my recap':'Skip the wait';
 if(sc==='recap'){const n=mine().filter(x=>x.flag&&!x.res).length;c={l:n?`Check ${n} flagged shots`:'Review and confirm',a:'tocorrect'}}
 if(sc==='correct')c={l:'Confirm',a:'confirm'};
 if(sc==='profile')c.l='Back to recap';
 if(sc==='community')c=state.hoop==='idle'?{l:"I'm down",a:'down'}:{l:'Plan a session',a:'next'};
 return c}

/* ---------- render ---------- */
let lastKey='';
function render(){
 clearTimers();
 const sc=state.screen;
 const key=sc+':'+state.step;
 const v=$('#view'),keep=v.scrollTop;
 v.innerHTML=SCREENS[sc]();
 const c=cta();
 v.insertAdjacentHTML('beforeend',`<div class="cta"><button class="btn pri" data-act="${c.a}" ${c.dis?'disabled':''}>${c.l}</button>${c.sec?`<button class="lnk" data-act="${c.sec.a}">${c.sec.l}</button>`:''}</div>`);
 const hasNav=sc!=='onboarding';
 v.classList.toggle('hasnav',hasNav);
 v.scrollTop=key===lastKey?keep:0;lastKey=key;
 /* progress */
 const ph=PHASE[sc];
 $('#prog').innerHTML=PH.map((t,i)=>`<div class="${i<ph?'past':i===ph?'on':''}"><i></i>${t}</div>`).join('');
 /* header */
 const n=nsteps(),canBack=!(sc==='onboarding'&&state.step===0);
 const chipOn=ORDER.indexOf(sc)>=1;
 let chip='';
 if(chipOn){
  const st=alt.disc?'off':alt.low?'low':'';
  const txt=alt.disc?'Paused':`Phone ${batt()}%`;
  chip=`<button class="dchip ${st}" data-act="devsheet" aria-label="Recording setup: ${txt}"><span class="dd"></span>${alt.low&&!alt.disc?icon('batt',14)+' ':''}${txt}</button>`}
 $('#hdr').innerHTML=`<button class="ib ${canBack?'':'ph'}" data-act="back" aria-label="Back">${icon('back',24)}</button><div class="hdt"><b>${HT[sc]}</b>${n>1?`<span>Step ${state.step+1} of ${n}</span>`:''}</div>${chip}`;
 /* nav */
 const NAVS=[['players','Players'],['identify','Identify'],['play','Play'],['recap','Recap'],['profile','Profile']];
 $('#nav').style.display=hasNav?'flex':'none';
 $('#nav').innerHTML=NAVS.map(([k,t])=>`<button class="${sc===k?'on':''}" data-act="nav" data-v="${k}">${icon(k,24)}${t}</button>`).join('');
 $('#sbr').innerHTML=alt.offline?icon('wifioff',18):'<span style="font-size:12px;letter-spacing:.05em">5G</span>';
 renderSheet();renderFlow();
 hooks();
}
function hooks(){
 const sc=state.screen,s=state.step;
 if(sc==='mount'){const iv=setInterval(()=>{const e=$('#mtimer');if(!e||state.mt.end)return;e.textContent=fmt((Date.now()-state.mt.start)/1000)},1000);timers.push(iv)}
 if(sc==='play'){const iv=setInterval(()=>{if(state.screen!=='play'||alt.disc)return;const p=state.play;if(p.i>=47)return;const sh=state.shots[p.i];p.i++;if(sh.made)p.m++;p.last=[...p.last,sh.made?'m':'x'].slice(-8);playDOM()},420);timers.push(iv)}
 if(sc==='processing'&&state.proc.i<4){const iv=setTimeout(()=>{state.proc.i++;render()},1100);timers.push(iv)}
}
function playDOM(){const p=state.play,set=(i,t)=>{const e=$(i);if(e)e.textContent=t};set('#pm',p.m);set('#pa',p.i);set('#ppct',pct(p.m,p.i)+'% FG');set('#ptime',fmt(p.i*52.3)+' elapsed · '+(state.mode==='multi'?'Multi-player':'Solo'));
 const l=$('#plast');if(l)l.innerHTML=p.last.map(x=>x==='m'?`<span title="Make" style="width:26px;height:26px;border-radius:50%;background:var(--or);display:inline-block"></span>`:`<span title="Miss" style="color:var(--ms);width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center">${icon('x',24,3)}</span>`).join('')}

/* ---------- sheets ---------- */
function renderSheet(){
 const r=$('#sheetroot'),sh=state.sheet;
 if(!sh){r.innerHTML='';return}
 let b='';
 if(sh.t==='clip'){const s=state.shots.find(x=>x.id===sh.id);b=`<div class="rowb"><span class="pill ${s.made?'make':'miss'}">${icon(s.made?'check':'x',14,3)} ${s.made?'Make':'Miss'}</span><span class="xs mu">${ZN[s.z]} · ${fmt(s.sec)}</span></div><div class="gap14">${clipScene(s)}</div>${s.flag&&!s.res?`<div class="note warn gap14">${icon('flag')}<div><b>Check this shot?</b>${s.flag}.</div></div>`:''}<button class="btn pri gap14" data-act="tocorrect1" data-id="${s.id}">Correct this shot</button><button class="btn gh gap8" data-act="sheet" data-t="share">${icon('share',18)} Share clip</button>`}
 if(sh.t==='device'){const bl=batt(),dc=alt.disc;b=`<div class="h2" style="font-size:28px">Recording setup</div><div class="illus">${phoneSVG(84,dc?'off':'on')}<div class="h2 gap8">${state.dev.name}</div></div>
  <div class="card gap14" style="padding:4px 16px"><div class="mrow"><span class="mu">${icon('target')}</span><span>Camera</span><b style="margin-left:auto">${dc?'Paused':'Ready'}</b></div><div class="mrow"><span class="mu">${icon('batt')}</span><span>Phone battery</span><b style="margin-left:auto">${bl}%${alt.low?' (low)':''}</b></div><div class="mrow"><span class="mu">${icon('sync')}</span><span>Upload</span><b style="margin-left:auto">${alt.offline?'When back online':'After the session'}</b></div></div>
  ${alt.low?`<div class="note warn">${icon('alert')}<div>Battery is low. Plug in after this session or bring a battery pack.</div></div>`:''}
  <div class="card gap14" style="border:1.5px dashed var(--ln2)"><div class="rowb"><b>Courtside hoop mount</b><span class="tag">Later</span></div><div class="xs mu gap8">Optional clip-on accessory for a steadier, fixed view. Not needed to use Courtside.</div></div>
  ${dc?'<button class="btn pri gap14" data-act="reconnect">Resume recording</button>':''}<button class="btn gh gap8" data-act="closesheet">Done</button>`}
 if(sh.t==='share'){b=`<div class="h2" style="font-size:28px">Share</div><div class="chips gap14">${['Community feed','Story','Messages','Copy link'].map(x=>`<button class="chip" data-act="shareto" data-v="${x}">${x}</button>`).join('')}</div><button class="btn gh gap20" data-act="closesheet">Cancel</button>`}

/* ---------- flow menu ---------- */
function renderFlow(){
 const f=$('#flow');
 const alts=[['frame','Phone not level or hoop not in frame'],['disc','Recording interrupted mid-session'],['low','Low phone battery'],['partial','Tracking failure (partial session)'],['offline','Offline court']];
 f.innerHTML=`<h2>Courtside</h2><div class="sub">Clickable prototype. Phone-first: no extra hardware needed. Tap the orange button on each screen to walk the journey.</div>
 <div class="fl-h">Jump to screen</div><div class="lst">${ORDER.map((k,i)=>`<button class="fl-btn ${state.screen===k?'on':''}" data-act="jump" data-v="${i}"><b>${i+1}</b>${MENU[k]}</button>`).join('')}</div>
 <button class="fl-btn restart" data-act="restart">Restart journey</button>
 <div class="fl-h">Alternate states</div>${alts.map(([k,t])=>`<button class="alt ${alt[k]?'on':''}" data-act="alt" data-v="${k}" aria-pressed="${alt[k]}"><span class="sw"></span>${t}</button>`).join('')}`}

/* ---------- navigation ---------- */
function go(sc,o={}){
 clearTimers();
 if(o.push!==false&&sc!==state.screen)state.hist.push(state.screen);
 state.screen=sc;state.step=o.last?nsteps(sc)-1:(o.step||0);state.sheet=null;
 if(sc==='mount'&&!o.last&&!o.keepMt){state.mt={start:null,end:null}}
 render();
}
function back(){
 if(state.step>0){state.step--;state.sheet=null;clearTimers();return render()}
 const prev=state.hist.pop();
 if(prev)go(prev,{push:false,last:true});
}
function jump(i,fromMenu){
 const sc=ORDER[i];state.hist=ORDER.slice(0,i);
  if(sc==='plan'&&state.hoop==='down'){}
 if(sc==='play'){state.play={i:0,m:0,last:[]}}
 if(sc==='processing')state.proc.i=0;
 if(sc==='recap'||sc==='profile')state.corr=[];
 go(sc,{push:false});
}
function next(){
 const sc=state.screen;
 if(sc==='mount'&&mountSteps()[state.step]==='ready'&&!state.mt.end)state.mt.end=Date.now();
 if(sc==='play'){state.proc.i=0;}
 if(state.step<nsteps()-1){state.step++;clearTimers();return render()}
 if(sc==='plan')return go('mount');
 const i=ORDER.indexOf(sc);
 if(sc==='profile')return go('recap');
 if(sc==='play'){state.proc.i=0}
 go(ORDER[i+1]);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;
 const act=a.dataset.act,v=a.dataset.v,d=a.dataset;
 switch(act){
  case 'next':return next();
  case 'back':return back();
  case 'nav':{const i=ORDER.indexOf(v);return jump(i)}
  case 'jump':return jump(+v,true);
  case 'restart':{clearTimers();const keep={...alt};Object.assign(state,fresh());Object.assign(alt,keep);lastKey='';render();return}
  case 'alt':alt[v]=!alt[v];if(v==='frame'&&alt.frame&&state.screen!=='mount'){}return render();
  case 'ob':{const val=v==='true'?true:v==='false'?false:v;state.ob[d.k]=val;return render()}
  case 'pcourt':state.plan.court=v;state.mountView=null;return render();
  case 'pday':state.plan.day=v;return render();
  case 'ptime':state.plan.time=v;return render();
  case 'pinv':state.plan.inv[v]=!state.plan.inv[v];return render();
  case 'mview':state.mountView=v;state.step=0;state.mt={start:null,end:null};return render();
  case 'gymok':state.gymOk=!state.gymOk;return render();
  case 'reconnect':alt.disc=false;state.sheet=null;toast('Recording resumed');return render();
  case 'fixframe':alt.frame=false;toast('Level. Rim in frame.');return render();
  case 'me':state.me=+d.i;return render();
  case 'pmode':state.mode=v;return render();
  case 'pteam':state.team[v]=!state.team[v];return render();
  case 'cmode':state.cmode=v;return render();
  case 'zone':state.zsel=state.zsel===d.z?null:d.z;return render();
  case 'shot':state.sheet={t:'clip',id:d.id};return renderSheet();
  case 'sheet':state.sheet={t:v==='share'?'share':v};return renderSheet();
  case 'devsheet':state.sheet={t:'device'};return renderSheet();
  case 'closesheet':state.sheet=null;return renderSheet();
  case 'shareto':{const w=v;state.sheet=null;if(w==='Community feed'){state.feed.push({w:'You',t:state.screen==='community'?clipOf()[state.hl].t:'Session card: '+stats().m+'/'+stats().a+', '+stats().fg+'% FG',s:'Just now'})}toast(w==='Copy link'?'Link copied':'Shared to '+w);return render()}
  case 'tocorrect':{state.corr=mine().filter(x=>x.flag&&!x.res).map(x=>x.id);state.draft={};return go('correct')}
  case 'tocorrect1':{state.corr=[d.id];state.draft={};state.sheet=null;return go('correct')}
  case 'cmade':state.draft[d.id].made=v==='1';return render();
  case 'cwho':state.draft[d.id].p=v;return render();
  case 'confirm':{Object.keys(state.draft).forEach(id=>{const s=state.shots.find(x=>x.id===id),dr=state.draft[id];s.made=dr.made;s.p=dr.p;s.res=true});state.corr=[];state.draft={};state.justConfirmed=true;toast('Session confirmed. Stats updated.');return go('profile')}
  case 'trend':state.trend=v;return render();
  case 'down':{state.hoop='down';state.plan.day='fri';state.plan.time='2pm';state.plan.court='fg';state.plan.inv.bryant=true;state.mountView=null;state.justConfirmed=false;toast('Locked in. Opening Plan with Friday 2 PM.');return go('plan')}
  case 'notnow':state.hoop='snoozed';return render();
  case 'undohoop':state.hoop='idle';return render();
  case 'hl':state.hl=+v;return render();
  case 'chal':state.chal=!state.chal;return render();
 }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.dot')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});

function fit(){const w=innerWidth,h=innerHeight,narrow=w<=880;let sc=narrow?Math.min(1,(w-60)/390):Math.min(1,(h-70)/844,(w-270-36-70)/390);sc=Math.max(.45,sc);document.documentElement.style.setProperty('--sc',sc)}
addEventListener('resize',fit);fit();
render();
</script>
</body>
</html>
